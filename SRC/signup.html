
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combox | Signup</title>

    <link rel="icon" type="image/png" href="icons/ganancia-financiera.png">

    <style>
        body {
            background-color: #8FE1FF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            background-color: white;
            width: 350px;
            margin: 50px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h3 {
            text-align: center;
            color: #168FC2;
            font-size: 24px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 2px solid #8FE1FF;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #168FC2;
        }

        button {
            width: 100%;
            background-color: #168FC2;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #08658F;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #168FC2;
            text-decoration: none;
        }

        .volver:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h3>Register New Combox User</h3>

        <form name="register-form" action="signup.php" method="post">

            <label>First Name:</label>
            <input type="text" name="fname" placeholder="Enter your first name" required>

            <label>Last Name:</label>
            <input type="text" name="lname" placeholder="Enter your last name" required>

            <label>Mobile Number:</label>
            <input type="tel" name="mphone" placeholder="Enter your mobile number" required>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password:</label>
            <input type="password" name="psw" placeholder="Create a password" required>

            <button type="submit">Register</button>

        </form>

        <a href="../index.html" class="volver">Back to Home</a>

    </div>

</body>
</html>
